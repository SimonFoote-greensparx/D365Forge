# Role catalogue: every project role the tailoring engine can fill.
# Owned by Robert Peledie (content) and Simon Foote (format). Status: draft.
# id is referenced by templates as {{roles.<id>}} and by data/role-combinations.toml.
# requires and desirable list skill ids from data/skills-vocabulary.toml.
# module: the module whose being in scope makes the role relevant ("all" means every project).
# editions: which editions expect the role as a separate seat (smb, enterprise).

[[role]]
id = "executive-sponsor"
title = "Executive Sponsor"
group = "governance"
department = "programme-management"
module = "all"
editions = ["smb", "enterprise"]
smb = "Owner or managing director, part-time; decisions made in the room."
enterprise = "Named sponsor chairing a steering committee with terms of reference."
requires = ["leadership", "budget-ownership"]
desirable = ["benefits-management"]

