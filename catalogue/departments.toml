# The department catalogue: the single source of truth for every department's metadata.
# scripts/build-port.py emits both sets of plugin manifests and both marketplaces from this file,
# scripts/build-readme.py emits the README tables, and scripts/build-site.py emits the website
# catalogue. Edit this file, then regenerate. Never hand-edit the generated files.
#
# layer:        module | delivery | reviewer | tailoring
# reviewer:     true when the department also acts as a read-only reviewer of other departments' work
# subject_lead: who specifies and signs off the content (Simon Foote, Robert Peledie or Both)

[[department]]
id = "sales"
title = "Sales"
lead_role = "Sales Functional Consultant"
layer = "module"
reviewer = false
subject_lead = "Robert Peledie"
description = "Dynamics 365 Sales delivery: lead to opportunity, sales process stages, products and price lists, quotes and orders, forecasting, sequences, Copilot in Sales and the Outlook and Teams experience."
keywords = ["dynamics-365-sales", "crm", "sales-process", "forecasting", "copilot"]

[[department]]
id = "marketing"
title = "Marketing"
