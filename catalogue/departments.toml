layer = "module"
reviewer = false
subject_lead = "Robert Peledie"
description = "Customer Insights - Journeys and Customer Insights - Data delivery: journeys, segments, email and text channels, forms and events, consent and preference centres, deliverability, lead scoring and hand-off, and profile unification."
keywords = ["customer-insights", "journeys", "marketing-automation", "consent", "deliverability"]

