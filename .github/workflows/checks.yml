name: checks

on:
  push:
    branches: [main]
  pull_request:

# The workflow only reads the tree and runs checks; it never writes back.
permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      # Same entry point as running the checks locally, so the two cannot drift.
      - run: bash scripts/check-all.sh
